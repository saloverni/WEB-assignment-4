<body>
  <header>
    <h1>Assignment 4. Forms and Validation</h1>

  <main>
    <h2>Task 0. Simple Contact Form</h2>
    <p>A basic form with labels.</p>
    <form>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" >
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" >
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" ></textarea>
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
    <p class="note">Practice form only. No server-side processing is implemented.</p>
  </main>
</body>
</html>
